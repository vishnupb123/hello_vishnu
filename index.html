<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishnu PB · AI Engineer & Researcher</title>
    <meta
      name="description"
      content="Vishnu PB is a Dublin-based AI engineer and published researcher who builds governed agentic systems, digital twins and multimodal ML. Open to full-time roles in Ireland (Stamp 1G)."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Set the theme before first paint: saved choice, else the system preference.
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vishnu PB · AI Engineer & Researcher" />
    <meta property="og:description" content="Systems that observe, reason and explain themselves. Dublin, Ireland." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
